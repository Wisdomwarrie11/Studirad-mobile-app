<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>StudiRad — Radiography Education & Clinical Career Hub</title>
    <meta name="description" content="E-learning and opportunity Sourcing platform for Radiography students and professionals" />
    <meta property="og:title" content="StudiRad — Radiography Education & Clinical Career Hub" />
    <meta property="og:description" content="E-learning and opportunity Sourcing platform for Radiography students and professionals" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile App Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#002147" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="StudiRad" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        function shouldSuppress(obj) {
          if (!obj) return false;
          var msg = String(obj.message || obj.reason || obj.description || obj || '');
          var file = String(obj.filename || '');
          var stack = String(obj.stack || (obj.error && obj.error.stack) || '');
          return (
            msg.indexOf('MetaMask') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('moz-extension://') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1 ||
            stack.indexOf('inpage.js') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event) || shouldSuppress(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('studirad_theme_preference');
          var isDark = saved ? saved === 'dark' : false; // Default to light mode
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0B0F17] text-slate-900 dark:text-slate-100 antialiased selection:bg-[#FF7F32]/30 selection:text-white m-0 p-0 min-h-screen transition-colors duration-150">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
